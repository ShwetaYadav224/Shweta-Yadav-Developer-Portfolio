<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shweta Yadav — Software Engineer & Full Stack Developer. Scalable web applications, clean architecture, delightful UX."
    />
    <meta name="author" content="Shweta Yadav" />

    <!-- Geist font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Set theme before paint to avoid flash (defaults to dark) -->
    <script>
      (function () {
        try {
          var k = "portfolio-theme";
          var t = localStorage.getItem(k);
          if (t !== "light" && t !== "dark") {
            t = "light";
          }
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <title>Shweta Yadav — Software Engineer & Full Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
